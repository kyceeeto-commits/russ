<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you, palangga ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Quicksand:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --cream: #fff8f1;
    --pink: #f5b8c9;
    --dark-pink: #d77b99;
    --green: #729879;
    --dark-green: #496c50;
    --brown: #76504a;
    --gold: #e7bd6d;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(245,184,201,.25), transparent 35%),
        linear-gradient(135deg, #fffaf5, #fceef1);
    color: var(--brown);
    font-family: "Quicksand", sans-serif;
}

/* -----------------------------
   SCREEN
----------------------------- */

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
}

/* -----------------------------
   FLOATING BACKGROUND
----------------------------- */

.background-heart {
    position: absolute;
    font-size: 18px;
    opacity: .35;
    animation: floatAround linear infinite;
    pointer-events: none;
}

@keyframes floatAround {
    0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .45;
    }

    85% {
        opacity: .45;
    }

    100% {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
    }
}

/* -----------------------------
   INTRO
----------------------------- */

.intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    transition: opacity 1s ease, transform 1s ease;
}

.intro.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.15);
}

.small-title {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--dark-pink);
    margin-bottom: 25px;
}

.intro h1 {
    font-family: "DM Serif Display", serif;
    font-size: clamp(42px, 10vw, 82px);
    font-weight: 400;
    font-style: italic;
    margin-bottom: 35px;
}

.click-text {
    font-size: 13px;
    letter-spacing: 2px;
    color: #987b78;
    animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
    0%,100% { opacity: .45; }
    50% { opacity: 1; }
}

/* -----------------------------
   ENVELOPE
----------------------------- */

.envelope {
    width: 260px;
    height: 175px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .4s ease;
    filter: drop-shadow(0 20px 25px rgba(100,60,60,.15));
}

.envelope:hover {
    transform: translateY(-8px) rotateX(3deg);
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: #f2b5c4;
    border-radius: 4px;
    overflow: hidden;
}

.envelope-body::before,
.envelope-body::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    background: #e79bad;
    transform: rotate(45deg);
}

.envelope-body::before {
    left: -135px;
    top: 50px;
}

.envelope-body::after {
    right: -135px;
    top: 50px;
}

.flap {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 95px solid #f7c7d3;
    top: 0;
    left: 0;
    transform-origin: top center;
    transition: transform .8s ease;
    z-index: 5;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.letter {
    position: absolute;
    width: 205px;
    height: 145px;
    left: 27px;
    top: 15px;
    background: #fffaf4;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "DM Serif Display", serif;
    font-style: italic;
    font-size: 23px;
    z-index: 2;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
}

.envelope.open .letter {
    transform: translateY(-95px);
}

/* -----------------------------
   MAIN GARDEN
----------------------------- */

.garden {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
}

.garden.show {
    opacity: 1;
    pointer-events: auto;
}

/* -----------------------------
   MESSAGE
----------------------------- */

.message {
    position: absolute;
    top: 8%;
    text-align: center;
    z-index: 15;
    opacity: 0;
    transform: translateY(20px);
    transition: 1s ease 1.8s;
}

.garden.show .message {
    opacity: 1;
    transform: translateY(0);
}

.message .tiny {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 10px;
    color: var(--dark-pink);
}

.message h2 {
    font-family: "DM Serif Display", serif;
    font-size: clamp(35px, 8vw, 65px);
    font-weight: 400;
    font-style: italic;
    margin-top: 8px;
}

.message p {
    margin-top: 8px;
    font-size: 14px;
    opacity: .7;
}

/* -----------------------------
   BOUQUET
----------------------------- */

.bouquet {
    position: relative;
    width: 390px;
    height: 500px;
    margin-top: 100px;
    transform-style: preserve-3d;
}

/* stems */

.stem {
    position: absolute;
    width: 7px;
    height: 230px;
    background: linear-gradient(90deg, #496c50, #8daf8b, #496c50);
    border-radius: 20px;
    left: 50%;
    bottom: 145px;
    transform-origin: bottom;
    z-index: 1;
    transition: 1.2s cubic-bezier(.2,.8,.2,1);
}

.stem.one {
    transform: rotate(-22deg);
}

.stem.two {
    transform: rotate(-12deg);
}

.stem.three {
    transform: rotate(0deg);
}

.stem.four {
    transform: rotate(12deg);
}

.stem.five {
    transform: rotate(22deg);
}

/* leaves */

.leaf {
    position: absolute;
    width: 65px;
    height: 30px;
    background: linear-gradient(135deg, #88a987, #547a5b);
    border-radius: 100% 0 100% 0;
    z-index: 2;
}

.leaf.l1 {
    left: 110px;
    bottom: 240px;
    transform: rotate(-28deg);
}

.leaf.l2 {
    left: 205px;
    bottom: 215px;
    transform: rotate(160deg);
}

.leaf.l3 {
    left: 135px;
    bottom: 180px;
    transform: rotate(15deg);
}

/* -----------------------------
   FLOWERS
----------------------------- */

.flower {
    position: absolute;
    width: 115px;
    height: 115px;
    transform-style: preserve-3d;
    z-index: 5;
    opacity: 0;
    transform: translateY(150px) scale(.2) rotateX(40deg);
}

.garden.show .flower {
    opacity: 1;
}

.garden.show .flower.f1 {
    animation: flowerPop 1.1s .15s cubic-bezier(.17,.84,.44,1) forwards;
}

.garden.show .flower.f2 {
    animation: flowerPop 1.1s .35s cubic-bezier(.17,.84,.44,1) forwards;
}

.garden.show .flower.f3 {
    animation: flowerPop 1.1s .55s cubic-bezier(.17,.84,.44,1) forwards;
}

.garden.show .flower.f4 {
    animation: flowerPop 1.1s .75s cubic-bezier(.17,.84,.44,1) forwards;
}

.garden.show .flower.f5 {
    animation: flowerPop 1.1s .95s cubic-bezier(.17,.84,.44,1) forwards;
}

@keyframes flowerPop {
    0% {
        opacity: 0;
        transform: translateY(180px) scale(.15) rotateX(70deg) rotateZ(-15deg);
    }

    55% {
        opacity: 1;
        transform: translateY(-25px) scale(1.12) rotateX(0) rotateZ(5deg);
    }

    75% {
        transform: translateY(8px) scale(.96) rotateZ(-3deg);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateZ(0);
    }
}

/* flower positions */

.f1 {
    left: 35px;
    top: 95px;
}

.f2 {
    left: 135px;
    top: 35px;
}

.f3 {
    left: 240px;
    top: 95px;
}

.f4 {
    left: 80px;
    top: 155px;
}

.f5 {
    left: 190px;
    top: 155px;
}

/* petals */

.petal {
    position: absolute;
    width: 52px;
    height: 75px;
    left: 31px;
    top: 20px;
    border-radius: 60% 60% 45% 45%;
    transform-origin: 50% 90%;
    box-shadow:
        inset 8px 8px 12px rgba(255,255,255,.35),
        inset -8px -8px 15px rgba(120,40,60,.12),
        0 8px 12px rgba(100,50,50,.12);
}

.petal:nth-child(1) { transform: rotate(0deg) translateY(-27px); }
.petal:nth-child(2) { transform: rotate(72deg) translateY(-27px); }
.petal:nth-child(3) { transform: rotate(144deg) translateY(-27px); }
.petal:nth-child(4) { transform: rotate(216deg) translateY(-27px); }
.petal:nth-child(5) { transform: rotate(288deg) translateY(-27px); }

/* different flower colors */

.pink .petal {
    background: radial-gradient(circle at 30% 20%, #ffd9e4, #e58da9 70%);
}

.rose .petal {
    background: radial-gradient(circle at 30% 20%, #ffd1d8, #d8657f 70%);
}

.peach .petal {
    background: radial-gradient(circle at 30% 20%, #ffe0c9, #ec9c76 70%);
}

.lilac .petal {
    background: radial-gradient(circle at 30% 20%, #eee1ff, #b78bc9 70%);
}

.white .petal {
    background: radial-gradient(circle at 30% 20%, #ffffff, #e7d8d4 70%);
}

/* centers */

.center {
    position: absolute;
    width: 32px;
    height: 32px;
    background: radial-gradient(circle at 35% 30%, #ffe9a9, #d99c3b);
    border-radius: 50%;
    left: 41px;
    top: 42px;
    z-index: 10;
    box-shadow:
        0 5px 10px rgba(100,60,20,.2),
        inset 2px 2px 4px rgba(255,255,255,.5);
}

/* -----------------------------
   WRAPPER
----------------------------- */

.wrapper {
    position: absolute;
    width: 270px;
    height: 170px;
    left: 60px;
    bottom: 40px;
    background:
        linear-gradient(135deg, rgba(255,255,255,.4), transparent 30%),
        linear-gradient(180deg, #eeb0bb, #cf7d91);
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    transform: rotate(-2deg);
    z-index: 7;
    box-shadow: 0 20px 30px rgba(100,50,50,.15);
}

.wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            75deg,
            transparent 0,
            transparent 18px,
            rgba(255,255,255,.12) 19px,
            transparent 20px
        );
}

.ribbon {
    position: absolute;
    width: 100%;
    height: 25px;
    background: #f4d8b3;
    bottom: 28px;
    z-index: 9;
}

.ribbon::after {
    content: "♡";
    position: absolute;
    right: 15px;
    top: -4px;
    font-size: 25px;
    color: #c47a83;
}

/* -----------------------------
   FINAL MESSAGE
----------------------------- */

.final-message {
    position: absolute;
    bottom: 4%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 1s ease 3.2s;
}

.garden.show .final-message {
    opacity: .7;
}

/* -----------------------------
   PETALS
----------------------------- */

.falling-petal {
    position: absolute;
    top: -30px;
    font-size: 20px;
    z-index: 30;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    100% {
        transform:
            translateY(110vh)
            translateX(var(--drift))
            rotate(500deg);
        opacity: 0;
    }
}

/* -----------------------------
   MUSIC BUTTON
----------------------------- */

.music {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(120,70,70,.15);
    background: rgba(255,255,255,.65);
    backdrop-filter: blur(10px);
    cursor: pointer;
    z-index: 100;
    color: var(--brown);
    font-size: 16px;
}

/* -----------------------------
   MOBILE
----------------------------- */

@media (max-width: 600px) {

    .envelope {
        width: 230px;
        height: 155px;
    }

    .flap {
        border-left-width: 115px;
        border-right-width: 115px;
        border-top-width: 85px;
    }

    .letter {
        width: 180px;
        height: 130px;
        left: 25px;
    }

    .bouquet {
        transform: scale(.78);
        margin-top: 90px;
    }

    .message {
        top: 7%;
    }

    .message p {
        padding: 0 25px;
    }

    .final-message {
        bottom: 3%;
        padding: 0 25px;
    }
}

@media (max-height: 700px) {
    .bouquet {
        transform: scale(.65);
        margin-top: 75px;
    }

    .message {
        top: 4%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- BACKGROUND HEARTS -->
    <div class="background-heart" style="left:5%; animation-duration:12s; animation-delay:0s;">♡</div>
    <div class="background-heart" style="left:18%; animation-duration:15s; animation-delay:4s;">♡</div>
    <div class="background-heart" style="left:32%; animation-duration:11s; animation-delay:2s;">♡</div>
    <div class="background-heart" style="left:48%; animation-duration:17s; animation-delay:7s;">♡</div>
    <div class="background-heart" style="left:63%; animation-duration:13s; animation-delay:3s;">♡</div>
    <div class="background-heart" style="left:77%; animation-duration:16s; animation-delay:6s;">♡</div>
    <div class="background-heart" style="left:91%; animation-duration:12s; animation-delay:1s;">♡</div>


    <!-- INTRO -->
    <section class="intro" id="intro">

        <div class="small-title">a little something</div>

        <div class="envelope" id="envelope">

            <div class="envelope-body"></div>

            <div class="letter">
                for you, palangga ♡
            </div>

            <div class="flap"></div>

        </div>

        <div class="click-text">
            click the letter
        </div>

    </section>


    <!-- GARDEN / BOUQUET -->
    <section class="garden" id="garden">

        <div class="message">
            <div class="tiny">this is for you</div>
            <h2>my love,</h2>
            <p>because you deserve something beautiful. ♡</p>
        </div>


        <div class="bouquet">

            <!-- FLOWER 1 -->
            <div class="flower f1 pink">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- FLOWER 2 -->
            <div class="flower f2 rose">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- FLOWER 3 -->
            <div class="flower f3 peach">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- FLOWER 4 -->
            <div class="flower f4 lilac">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- FLOWER 5 -->
            <div class="flower f5 white">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>


            <!-- STEMS -->
            <div class="stem one"></div>
            <div class="stem two"></div>
            <div class="stem three"></div>
            <div class="stem four"></div>
            <div class="stem five"></div>

            <!-- LEAVES -->
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>

            <!-- WRAPPER -->
            <div class="wrapper">
                <div class="ribbon"></div>
            </div>

        </div>


        <div class="final-message">
            ikaw at ako, hanggang dulo. ♡
        </div>

    </section>


    <!-- MUSIC -->
    <button class="music" id="musicButton" aria-label="music">♫</button>

    <!--
        OPTIONAL MUSIC:
        Put a file called "song.mp3" in the same GitHub folder.
    -->
    <audio id="song" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

</div>


<script>

/* --------------------------------
   ELEMENTS
-------------------------------- */

const envelope = document.getElementById("envelope");
const intro = document.getElementById("intro");
const garden = document.getElementById("garden");
const song = document.getElementById("song");
const musicButton = document.getElementById("musicButton");


/* --------------------------------
   OPEN LETTER
-------------------------------- */

envelope.addEventListener("click", () => {

    if (envelope.classList.contains("open")) return;

    envelope.classList.add("open");

    /*
       Give the letter time to open
       before transitioning into the bouquet.
    */

    setTimeout(() => {

        intro.classList.add("hide");

        setTimeout(() => {

            garden.classList.add("show");

            startPetals();

            /*
               Music starts only after
               the user has interacted.
            */

            song.play().catch(() => {});

        }, 700);

    }, 1100);

});


/* --------------------------------
   FALLING PETALS
-------------------------------- */

function createPetal() {

    const petal = document.createElement("div");

    petal.className = "falling-petal";

    const symbols = ["🌸", "♡", "✿", "❀"];

    petal.innerHTML =
        symbols[Math.floor(Math.random() * symbols.length)];

    petal.style.left =
        Math.random() * 100 + "vw";

    petal.style.setProperty(
        "--drift",
        (Math.random() * 250 - 125) + "px"
    );

    petal.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    petal.style.fontSize =
        (12 + Math.random() * 13) + "px";

    document.body.appendChild(petal);

    setTimeout(() => {
        petal.remove();
    }, 12000);
}


function startPetals() {

    /*
       Initial burst
    */

    for (let i = 0; i < 22; i++) {

        setTimeout(() => {
            createPetal();
        }, i * 120);

    }

    /*
       Continue falling
    */

    setInterval(() => {

        createPetal();

    }, 700);

}


/* --------------------------------
   MUSIC BUTTON
-------------------------------- */

let playing = false;

musicButton.addEventListener("click", () => {

    if (!playing) {

        song.play().catch(() => {});

        musicButton.innerHTML = "❚❚";

        playing = true;

    } else {

        song.pause();

        musicButton.innerHTML = "♫";

        playing = false;

    }

});


/* --------------------------------
   EXTRA FLOWER BOUNCE
-------------------------------- */

document.querySelectorAll(".flower").forEach(flower => {

    flower.addEventListener("click", () => {

        flower.animate(
            [
                {
                    transform: "scale(1)"
                },
                {
                    transform: "scale(1.18) rotate(5deg)"
                },
                {
                    transform: "scale(1)"
                }
            ],
            {
                duration: 500,
                easing: "ease-out"
            }
        );

    });

});

</script>

</body>
</html>
